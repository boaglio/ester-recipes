spring:
  application:
    name: ester-recipes
  threads:
    # Run pipeline tasks on virtual threads (ideal for the blocking Ollama calls).
    virtual:
      enabled: true
  main:
    # This is a batch/CLI pipeline, not a web server.
    web-application-type: none
    banner-mode: off
  ai:
    ollama:
      base-url: http://localhost:11434
      # Don't try to pull models at startup; we manage that with `ollama pull`.
      init:
        pull-model-strategy: never
      chat:
        # qwen2.5vl:7b — partly on the CPU with an 8 GB card (19/29 layers), ~1 min/image.
        # Don't use qwen3-vl:4b: it only "thinks" and never returns an answer.
        model: qwen2.5vl:7b
        # NOTE: structured-output `format` (a JSON schema) is set per request in
        # RecipeExtractionService so decoding is constrained to our recipe structure.
        # Zero temperature → faithful, deterministic transcription, not creative cooking.
        temperature: 0.0
        # Keep as much of the model + KV cache as possible on the GPU (8 GB, shared with the
        # desktop). A bigger context spills more to CPU, which is much slower. Answers that fill
        # it are the model repeating itself, which a bigger context doesn't cure: retries of that
        # scan raise the repeat penalty instead (RecipeExtractionService).
        num-ctx: 8192
        # Hard output cap so a runaway/looping page can't generate for tens of minutes; it
        # truncates and fails fast instead. Far more than any real page of recipes needs.
        num-predict: 8192

ester:
  input-dir: ./recipes/pending
  processed-dir: ./recipes/processed
  # Scans the model found no recipe in, such as covers. Listed in the check report to look over.
  no-recipe-dir: ./recipes/no-recipe
  json-dir: ./recipes/json
  output-dir: ./output
  pdf-name: ester-recipes.pdf
  pdf-title: Receitas da Ester
  # How many images to process in parallel. Each is one concurrent Ollama request.
  # NOTE: a single GPU running one model is usually compute-bound, so raising this only
  # helps if the Ollama server also has OLLAMA_NUM_PARALLEL >= concurrency AND spare VRAM.
  # On an 8 GB card it gives little/no gain — measure before bumping it.
  # 1 = sequential (default, safest).
  concurrency: 1
  # Longest side, in pixels, of the image sent to the vision model (the scan on disk is not
  # changed). Full-size 6-10 MP photos cost ~5400 of the 8192 context tokens and ~1.3 GB of
  # GPU memory to encode; at 1600 they cost ~2400 tokens. Raise it if small print is misread.
  # 0 = send the original.
  max-image-side: 1600

  # Optional check: reads every scan again with a second vision model and writes a report of
  # the pages where the two readings disagree (output/check-report-*.md). It changes no recipe.
  # About 30 s more per scan with gemma4. Enable with --ester.check.enabled=true.
  check:
    enabled: false
    model: "gemma4:latest"
    # One text file per scan and model, so a later run doesn't read the same scan again.
    dir: ./recipes/check

  # Optional anime-image phase via a local ComfyUI server (docker-compose.yml). OFF by
  # default — it's a separate pass so it never competes with extraction for the GPU.
  # Enable with --ester.images.enabled=true AFTER the extraction batch and once ComfyUI is up.
  images:
    enabled: false
    base-url: http://localhost:8188
    # File name of the checkpoint you placed in comfyui/models/checkpoints/.
    checkpoint: Counterfeit-V2.5_pruned.safetensors
    steps: 25
    # Small per-recipe images (agents.md). 512 is native for SD 1.5 anime models and fast
    # for a 400+ image batch; bump to 768/1024 for an SDXL checkpoint.
    width: 512
    height: 512
    dir: ./recipes/images
    negative-prompt: "1girl, 1boy, person, people, human, character, woman, man, girl, boy, maid, face, hands, portrait, room, interior, restaurant, dining room, kitchen, cafeteria, chairs, furniture, window, shelves, scenery, empty table, empty plate, lowres, blurry, text, watermark, signature, deformed, ugly"
    timeout-seconds: 180
    # Added to every image seed. Images are reproducible, so deleting one and running again
    # draws the same picture; change this (1, 2, ...) to get different ones.
    seed-offset: 0

  # Optional second routine: translate any recipe that still has non-Portuguese (e.g. Italian)
  # text into Brazilian Portuguese, in place. OFF by default.
  # Enable with --ester.translation.enabled=true (does no extraction; rewrites JSON + PDF).
  translation:
    enabled: false
    # Translation runs as a separate phase with a stronger text model than the vision model.
    # Extraction transcribes faithfully (original language); this model translates to PT-BR.
    model: "gemma4:latest"

logging:
  level:
    root: WARN
    com.ester.recipes: INFO
